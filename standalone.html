<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="澳門公共停車場即時空位、地圖搜尋及停車費用模擬。"
    />
    <meta name="theme-color" content="#f4f5f1" />
    <meta name="application-name" content="泊車澳門" />
    <meta name="apple-mobile-web-app-title" content="泊車澳門" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>泊車澳門 · 即時車位與計費</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link
      rel="apple-touch-icon"
      href="./icons/apple-touch-icon.png"
      sizes="180x180"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <style>
:root {
  color-scheme: light;
  --bg: #f4f5f1;
  --surface: #ffffff;
  --surface-soft: #eef0ec;
  --ink: #17201f;
  --muted: #66716d;
  --line: #dce1dc;
  --line-strong: #c8cfca;
  --teal: #0b6b65;
  --teal-dark: #07514d;
  --teal-soft: #dcefeb;
  --amber: #b86d18;
  --amber-soft: #fff0d5;
  --red: #bd463d;
  --red-soft: #fbe5e1;
  --green: #2c7a53;
  --green-soft: #e1f1e7;
  --shadow: 0 18px 48px rgba(23, 32, 31, 0.14);
  --radius: 8px;
  --font:
    "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--bg);
}

body {
  min-height: 100vh;
  margin: 0;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.64), transparent 260px),
    var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
}

button,
input,
select {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  display: block;
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 3px solid rgba(11, 107, 101, 0.3);
  outline-offset: 2px;
}

.app-shell {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 68px;
  padding: 10px max(18px, calc((100vw - 1480px) / 2));
  border-bottom: 1px solid rgba(200, 207, 202, 0.82);
  background: rgba(244, 245, 241, 0.92);
  backdrop-filter: blur(16px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.brand-mark {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: var(--radius);
  background: var(--teal);
  color: white;
  box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.14);
}

.brand-mark svg {
  width: 25px;
  height: 25px;
}

.brand-copy {
  display: grid;
  min-width: 0;
}

.brand-copy strong {
  font-size: 17px;
  letter-spacing: 0;
}

.brand-copy small {
  color: var(--muted);
  font-size: 12px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.source-status {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.72);
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.source-status[data-state="warning"] {
  border-color: #e3c083;
  background: var(--amber-soft);
  color: #7b4a0d;
}

.source-status[data-state="error"] {
  border-color: #e6b1a9;
  background: var(--red-soft);
  color: #8e2821;
}

.source-age {
  color: inherit;
  opacity: 0.72;
}

.status-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(44, 122, 83, 0.12);
}

.source-status[data-state="loading"] .status-dot {
  background: var(--amber);
  animation: pulse 1.2s ease-in-out infinite;
}

.source-status[data-state="warning"] .status-dot {
  background: var(--amber);
}

.source-status[data-state="error"] .status-dot {
  background: var(--red);
}

.icon-button,
.primary-button,
.secondary-button {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 650;
  line-height: 1;
  transition:
    background-color 150ms ease,
    border-color 150ms ease,
    color 150ms ease,
    transform 150ms ease;
}

.icon-button {
  width: 38px;
  padding: 0;
  border-color: var(--line);
  background: var(--surface);
  color: var(--ink);
}

.icon-button:hover,
.secondary-button:hover {
  border-color: var(--line-strong);
  background: var(--surface-soft);
}

.primary-button {
  border-color: var(--teal);
  background: var(--teal);
  color: white;
}

.primary-button:hover {
  border-color: var(--teal-dark);
  background: var(--teal-dark);
}

.secondary-button {
  border-color: var(--line);
  background: var(--surface);
  color: var(--ink);
}

.primary-button:active,
.secondary-button:active,
.icon-button:active {
  transform: translateY(1px);
}

.icon-button.is-loading svg {
  animation: spin 0.9s linear infinite;
}

.main-content {
  width: min(1480px, calc(100% - 36px));
  margin: 0 auto;
  padding: 18px 0 38px;
}

.control-band {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) 132px 160px auto;
  gap: 10px;
  align-items: end;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.78);
}

.search-field {
  display: flex;
  min-height: 42px;
  align-items: center;
  gap: 9px;
  min-width: 0;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface);
}

.search-field:focus-within {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(11, 107, 101, 0.1);
}

.search-field > svg {
  color: var(--muted);
}

.search-field input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
}

.search-field input::placeholder {
  color: #8a9490;
}

.search-clear {
  display: grid;
  width: 26px;
  height: 26px;
  flex: 0 0 auto;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--surface-soft);
  color: var(--muted);
  cursor: pointer;
}

.search-clear svg {
  width: 15px;
  height: 15px;
}

.select-field,
.form-field {
  display: grid;
  gap: 6px;
  min-width: 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}

.select-field select,
.form-field select,
.form-field input {
  width: 100%;
  min-width: 0;
  height: 42px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  outline: 0;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
}

.select-field select:focus,
.form-field select:focus,
.form-field input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(11, 107, 101, 0.1);
}

.check-field {
  display: flex;
  min-height: 42px;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.check-field input {
  width: 16px;
  height: 16px;
  accent-color: var(--teal);
}

.vehicle-band {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
}

.estimate-band {
  display: grid;
  grid-template-columns: auto 190px 190px minmax(180px, 1fr);
  gap: 10px;
  align-items: end;
  margin-top: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.72);
}

.estimate-toggle {
  min-height: 38px;
}

.estimate-field {
  display: grid;
  gap: 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
}

.estimate-field input {
  width: 100%;
  min-width: 0;
  height: 38px;
  padding: 0 9px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
}

.estimate-field input:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}

.estimate-summary {
  align-self: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}

.vehicle-switch,
.view-switch {
  display: inline-flex;
  min-width: 0;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.76);
}

.vehicle-switch {
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}

.vehicle-switch::-webkit-scrollbar {
  display: none;
}

.vehicle-option,
.view-option {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 7px 11px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  font-weight: 650;
  white-space: nowrap;
}

.vehicle-option small {
  min-width: 24px;
  padding: 2px 5px;
  border-radius: 999px;
  background: var(--surface-soft);
  color: var(--muted);
  font-size: 10px;
  text-align: center;
}

.vehicle-option:hover,
.view-option:hover {
  color: var(--ink);
  background: var(--surface-soft);
}

.vehicle-option.is-active,
.view-option.is-active {
  background: var(--teal);
  color: white;
}

.vehicle-option.is-active small {
  background: rgba(255, 255, 255, 0.18);
  color: white;
}

.metric-band {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 14px 0 16px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.metric-cell {
  display: flex;
  min-height: 76px;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-right: 1px solid var(--line);
}

.metric-cell:last-child {
  border-right: 0;
}

.metric-icon {
  display: grid;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 50%;
  background: var(--teal-soft);
  color: var(--teal);
}

.metric-cell > div {
  display: grid;
}

.metric-cell strong {
  font-size: 22px;
  line-height: 1.1;
}

.metric-cell span {
  color: var(--muted);
  font-size: 12px;
}

.view-panel {
  animation: reveal 180ms ease-out;
}

.location-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  margin-bottom: 12px;
  padding: 11px 13px;
  border: 1px solid #e2c696;
  border-radius: var(--radius);
  background: var(--amber-soft);
}

.location-strip.is-ready {
  border-color: #acd4c8;
  background: var(--teal-soft);
}

.location-strip > div {
  display: grid;
  flex: 1;
  min-width: 0;
}

.location-strip strong {
  font-size: 14px;
}

.location-strip span {
  color: var(--muted);
  font-size: 12px;
}

.location-icon {
  display: grid;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  color: var(--amber);
}

.location-strip.is-ready .location-icon {
  color: var(--teal);
}

.location-strip .secondary-button {
  flex: 0 0 auto;
}

.list-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 0 2px 10px;
}

.list-heading h2 {
  margin: 0;
  font-size: 18px;
}

.list-heading span {
  color: var(--muted);
  font-size: 13px;
}

.results-list {
  display: grid;
  gap: 10px;
}

.park-card {
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr) auto;
  min-height: 136px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: 0 1px 0 rgba(23, 32, 31, 0.02);
  transition:
    border-color 150ms ease,
    box-shadow 150ms ease,
    transform 150ms ease;
}

.park-card.has-estimate {
  grid-template-columns: 104px minmax(0, 1fr) 142px auto;
}

.park-card:hover {
  border-color: var(--line-strong);
  box-shadow: 0 8px 24px rgba(23, 32, 31, 0.07);
  transform: translateY(-1px);
}

.availability-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 13px 10px;
  background: var(--surface-soft);
  text-align: center;
}

.availability-block strong {
  font-size: 32px;
  line-height: 1;
}

.availability-block span {
  margin-top: 7px;
  color: var(--muted);
  font-size: 11px;
}

.availability-block em {
  margin-top: 8px;
  padding: 3px 7px;
  border-radius: 999px;
  background: white;
  font-size: 10px;
  font-style: normal;
  font-weight: 700;
}

.status-open .availability-block,
.availability-block.status-open,
.drawer-hero.status-open {
  background: var(--green-soft);
  color: var(--green);
}

.status-limited .availability-block,
.availability-block.status-limited,
.drawer-hero.status-limited {
  background: var(--amber-soft);
  color: var(--amber);
}

.status-low .availability-block,
.availability-block.status-low,
.drawer-hero.status-low,
.status-full .availability-block,
.availability-block.status-full,
.drawer-hero.status-full {
  background: var(--red-soft);
  color: var(--red);
}

.status-unknown .availability-block,
.availability-block.status-unknown,
.drawer-hero.status-unknown {
  background: var(--surface-soft);
  color: var(--muted);
}

.status-maintenance .availability-block,
.availability-block.status-maintenance,
.drawer-hero.status-maintenance,
.map-marker.status-maintenance {
  background: var(--amber-soft);
  color: var(--amber);
}

.park-card-body {
  display: grid;
  min-width: 0;
  align-content: center;
  gap: 8px;
  padding: 14px 16px;
}

.park-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.park-title-row h3 {
  min-width: 0;
  margin: 0;
  font-size: 17px;
  line-height: 1.3;
}

.park-title-row h3 button {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}

.park-title-row h3 button:hover {
  color: var(--teal);
}

.park-labels {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 5px;
}

.new-label {
  padding: 3px 7px;
  border-radius: 999px;
  background: var(--teal);
  color: white;
  font-size: 10px;
  font-weight: 750;
}

.region-label {
  flex: 0 0 auto;
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
}

.estimate-block {
  display: grid;
  min-width: 0;
  align-content: center;
  justify-items: end;
  gap: 4px;
  padding: 13px 14px;
  border-left: 1px solid var(--line);
  background: #f7faf7;
  text-align: right;
}

.estimate-block span,
.estimate-block small {
  color: var(--muted);
  font-size: 10px;
}

.estimate-block strong {
  color: var(--teal-dark);
  font-size: 17px;
  line-height: 1.15;
  white-space: nowrap;
}

.estimate-block.is-unsupported strong {
  color: var(--muted);
  font-size: 15px;
}

.park-location {
  display: -webkit-box;
  overflow: hidden;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 1;
}

.park-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 14px;
  color: var(--muted);
  font-size: 11px;
}

.park-meta span,
.park-fee {
  display: inline-flex;
  min-width: 0;
  align-items: center;
  gap: 5px;
}

.park-meta svg,
.park-fee svg {
  width: 14px;
  height: 14px;
}

.park-fee {
  color: var(--teal-dark);
  font-size: 12px;
  font-weight: 650;
}

.park-fee span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.park-card-actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 8px;
  padding: 13px;
  border-left: 1px solid var(--line);
  background: #fbfcfa;
}

.park-card-actions .secondary-button {
  white-space: nowrap;
}

.park-card.is-compact {
  grid-template-columns: 76px minmax(0, 1fr);
  min-height: 120px;
}

.park-card.is-compact.has-estimate {
  grid-template-columns: 76px minmax(0, 1fr) 96px;
}

.park-card.is-compact .estimate-block {
  justify-items: center;
  padding: 10px 7px;
  text-align: center;
}

.park-card.is-compact .estimate-block strong {
  font-size: 14px;
  white-space: normal;
}

.park-card.is-compact .availability-block strong {
  font-size: 26px;
}

.park-card.is-compact .park-card-body {
  padding: 12px;
}

.park-card.is-compact .park-title-row h3 {
  font-size: 15px;
}

.park-card.is-compact .park-card-actions {
  grid-column: 1 / -1;
  flex-direction: row;
  justify-content: flex-end;
  padding: 8px 10px;
  border-top: 1px solid var(--line);
  border-left: 0;
}

.empty-state {
  display: grid;
  min-height: 260px;
  place-items: center;
  align-content: center;
  gap: 8px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.58);
  color: var(--muted);
  text-align: center;
}

.empty-state svg {
  width: 30px;
  height: 30px;
}

.empty-state strong {
  color: var(--ink);
}

.empty-state span {
  font-size: 12px;
}

.map-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  gap: 12px;
  align-items: start;
}

.map-frame {
  position: relative;
  min-height: 620px;
  height: min(72vh, 760px);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #dfe7e2;
}

#map {
  width: 100%;
  height: 100%;
}

.map-results-pane {
  display: flex;
  flex-direction: column;
  height: min(72vh, 760px);
  min-height: 620px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.72);
  padding: 12px;
}

.map-location-strip {
  display: flex;
  min-height: 42px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  padding: 8px 10px;

  const scopedRate = line.match(
    /MOP\s*\$?(\d+(?:\.\d+)?)\s*[（(](日間|夜間)[）)]/,
  );
  if (scopedRate) {
    return cloneRule({
      scope: scopedRate[2] === "夜間" ? "night" : "day",
      unitMinutes: defaultUnit,
      rate: scopedRate[1],
    });
  }

  const prefixedRate = line.match(
    /^[（(](日間|夜間)[）)]\s*MOP\s*\$?(\d+(?:\.\d+)?)/,
  );
  if (prefixedRate) {
    return cloneRule({
      scope: prefixedRate[1] === "夜間" ? "night" : "day",
      unitMinutes: defaultUnit,
      rate: prefixedRate[2],
    });
  }

  const bareRate = line.match(/^MOP\s*\$?(\d+(?:\.\d+)?)$/);
  if (bareRate) {
    return cloneRule({
      scope,
      unitMinutes: defaultUnit,
      rate: bareRate[1],
    });
  }

  return null;
}

function parseCaps(lines, notes) {
  const caps = {
    dayCap: null,
    nightCap: null,
    cap24h: null,
  };
  const joined = `${lines.join("\n")}\n${notes || ""}`;

  const dayCap = joined.match(/日間封頂\s*MOP\s*\$?(\d+(?:\.\d+)?)/);
  const nightCap = joined.match(/夜間封頂\s*MOP\s*\$?(\d+(?:\.\d+)?)/);
  const cap24 = joined.match(/(?:24小時|二十四小時)封頂\s*MOP\s*\$?(\d+(?:\.\d+)?)/);

  if (dayCap) caps.dayCap = Number(dayCap[1]);
  if (nightCap) caps.nightCap = Number(nightCap[1]);
  if (cap24) caps.cap24h = Number(cap24[1]);

  return caps;
}

function parseGraceMinutes(notes = "") {
  if (!notes) return null;
  if (/十五分鐘內(?:離場|出場)/.test(notes)) return 15;
  const numeric = notes.match(/(\d+)\s*分鐘內(?:離場|出場)/);
  return numeric ? Number(numeric[1]) : null;
}

function parsePackage(lines, defaultUnit) {
  const joined = lines.join("\n");
  const match = joined.match(
    /每連續\s*(\d+)\s*-\s*(\d+)\s*小時\s*MOP\s*\$?(\d+(?:\.\d+)?)/,
  );
  if (!match) return null;

  const fromMinutes = Number(match[1]) * 60;
  const toMinutes = Number(match[2]) * 60;
  const amount = Number(match[3]);
  const baseLine = lines.find(
    (line) =>
      !/每連續/.test(line) &&
      /MOP\s*\$?\d+(?:\.\d+)?/.test(line) &&
      !/封頂/.test(line),
  );
  const baseRule = baseLine
    ? parseRuleLine(baseLine, defaultUnit, "all")
    : null;

  return {
    fromMinutes,
    toMinutes,
    amount,
    baseRule: baseRule || {
      scope: "all",
      unitMinutes: defaultUnit,
      rate: amount / (fromMinutes / defaultUnit),
    },
  };
}

function parseVariantLabel(notes, number) {
  if (!notes) return `方案 ${number}`;
  const pattern = new RegExp(`[（(]?註${number}[）)]?\\s*[：:]\\s*([^。\\n]+)`);
  const match = notes.match(pattern);
  return match ? clean(match[1]) : `方案 ${number}`;
}

function splitMarkedVariants(text, notes) {
  const markerMatches = [...text.matchAll(/[（(]註(\d+)[）)]/g)];
  if (markerMatches.length < 2) return null;

  const variants = [];
  let cursor = 0;
  markerMatches.forEach((marker, index) => {
    const part = text.slice(cursor, marker.index);
    if (part.trim()) {
      variants.push({
        label: parseVariantLabel(notes, marker[1]),
        lines: part
          .split("\n")
          .map(clean)
          .filter(Boolean),
        id: `note-${marker[1]}`,
      });
    }
    cursor = marker.index + marker[0].length;
    if (index === markerMatches.length - 1) {
      const tail = text.slice(cursor);
      if (tail.trim()) {
        variants.push({
          label: parseVariantLabel(notes, marker[1]),
          lines: tail
            .split("\n")
            .map(clean)
            .filter(Boolean),
          id: `note-${marker[1]}`,
        });
      }
    }
  });
  return variants.length >= 2 ? variants : null;
}

function splitHeadingVariants(text) {
  const lines = text
    .split("\n")
    .map(clean)
    .filter(Boolean);
  const groups = [];
  let current = { id: "standard", label: "標準", lines: [] };

  for (const line of lines) {
    const isVariantHeading =
      /^(?:長度|高度|車長)/.test(line) && !/MOP\s*\$?\d/.test(line);
    if (isVariantHeading) {
      if (current.lines.length) groups.push(current);
      current = {
        id: `variant-${groups.length + 1}`,
        label: line,
        lines: [],
      };
      continue;
    }
    current.lines.push(line);
  }

  if (current.lines.length || !groups.length) groups.push(current);
  return groups;
}

function noteCapForVehicle(vehicleKey, notes = "") {
  if (!notes) return {};

  const result = {};
  const isLight = ["light", "electricCar"].includes(vehicleKey);
  const isMotorcycle = ["motorcycle", "electricMotorcycle"].includes(vehicleKey);
  const isHeavy = vehicleKey === "heavy";

  if (isLight) {
    const cap24 = notes.match(
      /輕型汽車在每連續二十四小時內[^。]*上限為澳門元\s*(\d+(?:\.\d+)?)\s*元/,
    );
    const nightCap = notes.match(
      /輕型汽車在每連續夜間普通票[^。]*上限為澳門元\s*(\d+(?:\.\d+)?)\s*元/,
    );
    if (cap24) result.cap24h = Number(cap24[1]);
    if (nightCap) result.nightCap = Number(nightCap[1]);
  }

  if (isMotorcycle) {
    const cap24 = notes.match(
      /重型及輕型摩托車在每連續二十四小時內[^。]*上限為澳門元\s*(\d+(?:\.\d+)?)\s*元/,
    );
    const splitCaps = notes.match(
      /重型及輕型摩托車[^。]*上限分別為澳門元\s*(\d+(?:\.\d+)?)\s*元及澳門元\s*(\d+(?:\.\d+)?)\s*元/,
    );
    const nightCap = notes.match(
      /重型及輕型摩托車在每連續夜間普通票[^。]*上限為澳門元\s*(\d+(?:\.\d+)?)\s*元/,
    );
    if (cap24) result.cap24h = Number(cap24[1]);
    if (splitCaps) {
      result.dayCap = Number(splitCaps[1]);
      result.nightCap = Number(splitCaps[2]);
    }
    if (nightCap) result.nightCap = Number(nightCap[1]);
  }

  if (isHeavy) {
    const cap24 = notes.match(
      /重型(?:汽車|貨車|客車)在每連續二十四小時內[^。]*上限為澳門元\s*(\d+(?:\.\d+)?)\s*元/,
    );
    if (cap24) result.cap24h = Number(cap24[1]);
  }

  return result;
}

function buildOption({ id, label, lines, heading, notes }) {
  const defaultUnit = defaultUnitFromHeading(heading);
  const rules = [];
  let activeScope = "all";

  for (const line of lines) {
    const lineScope = scopeFromText(line);
    if (lineScope !== "all") activeScope = lineScope;
    const rule = parseRuleLine(line, defaultUnit, activeScope);
    if (rule) rules.push(rule);
  }

  const caps = {
    ...parseCaps(lines, notes),
    ...noteCapForVehicle("", notes),
  };
  const packageRule = parsePackage(lines, defaultUnit);
  const supported = rules.length > 0 || Boolean(packageRule);

  return {
    id,
    label: label || "標準",
    supported,
    rules,
    packageRule,
    dayCap: caps.dayCap,
    nightCap: caps.nightCap,
    cap24h: caps.cap24h,
    graceMinutes: parseGraceMinutes(notes),
    source: clean(lines.join("\n")),
  };
}

function noteCapsForOption(option, vehicleKey, notes) {
  const caps = noteCapForVehicle(vehicleKey, notes);
  return {
    ...option,
    dayCap: option.dayCap ?? caps.dayCap ?? null,
    nightCap: option.nightCap ?? caps.nightCap ?? null,
    cap24h: option.cap24h ?? caps.cap24h ?? null,
  };
}

function parseVehicleTariff(park, vehicleKey) {
  const vehicle = VEHICLES[vehicleKey] || VEHICLES.light;
  const source = park?.tariffs?.[vehicle.tariffKey] || "";
  const notes = park?.tariffs?.notes || "";
  const heading = park?.feeHeading || "";

  if (!source || source === "-" || clean(source) === "—") {
    return {
      supported: false,
      heading,
      source,
      notes,
      options: [],
    };
  }

  const markedVariants = splitMarkedVariants(source, notes);
  const variants = markedVariants || splitHeadingVariants(source);
  const options = variants
    .map((variant) =>
      buildOption({
        id: variant.id,
        label: variant.label,
        lines: variant.lines,
        heading,
        notes,
      }),
    )
    .map((option) => noteCapsForOption(option, vehicleKey, notes));

  return {
    supported: options.some((option) => option.supported),
    heading,
    source,
    notes,
    options,
  };
}

function getPeriodScope(date) {
  const minutes = date.getHours() * 60 + date.getMinutes();
  return minutes >= DAY_START && minutes < NIGHT_START ? "day" : "night";
}

function getNextBoundary(date) {
  const next = new Date(date);
  const scope = getPeriodScope(date);

  if (scope === "day") {
    next.setHours(20, 0, 0, 0);
    return next;
  }

  if (date.getHours() < 8) {
    next.setHours(8, 0, 0, 0);
    return next;
  }

  next.setDate(next.getDate() + 1);
  next.setHours(8, 0, 0, 0);
  return next;
}

function makeSegments(entry, exit, option) {
  const hasScopedRules = option.rules.some((rule) => rule.scope !== "all");
  if (!hasScopedRules) {
    return [
      {
        scope: "all",
        start: entry,
        end: exit,
        minutes: (exit - entry) / MINUTE,
      },
    ];
  }

  const segments = [];
  let cursor = new Date(entry);
  while (cursor < exit) {
    const scope = getPeriodScope(cursor);
    const boundary = getNextBoundary(cursor);
    const end = boundary < exit ? boundary : exit;
    segments.push({
      scope,
      start: new Date(cursor),
      end: new Date(end),
      minutes: (end - cursor) / MINUTE,
    });
    cursor = end;
  }
  return segments;
}

function chargeRule(rule, minutes) {
  if (!rule || minutes <= 0) return 0;
  if (rule.firstMinutes && rule.firstRate !== null) {
    const remaining = Math.max(0, minutes - rule.firstMinutes);
    return (
      rule.firstRate +
      Math.ceil(remaining / rule.unitMinutes) * rule.rate
    );
  }
  return Math.ceil(minutes / rule.unitMinutes) * rule.rate;
}

function ruleLabel(rule) {
  const scope =
    rule.scope === "day" ? "日間" : rule.scope === "night" ? "夜間" : "全日";
  const unit = rule.unitMinutes === 30 ? "半小時" : "小時";
  if (rule.firstMinutes && rule.firstRate !== null) {
    return `${scope}首小時 MOP ${rule.firstRate}，其後每${unit} MOP ${rule.rate}`;
  }
  return `${scope}每${unit} MOP ${rule.rate}`;
}

function capRecords(records, cap, predicate = () => true) {
  const groups = new Map();
  records.forEach((record, index) => {
    if (!predicate(record)) return;
    const key = record.capKey || String(index);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(record);
  });

  for (const group of groups.values()) {
    const total = group.reduce((sum, record) => sum + record.charge, 0);
    if (total <= cap) continue;
    const ratio = cap / total;
    for (const record of group) {
      record.originalCharge = record.charge;
      record.charge *= ratio;
      record.capped = true;
    }
  }
}

function applyCaps(records, option) {
  if (option.dayCap !== null) {
    capRecords(records, option.dayCap, (record) => record.scope === "day");
  }
  if (option.nightCap !== null) {
    capRecords(records, option.nightCap, (record) => record.scope === "night");
  }
  if (option.cap24h !== null) {
    capRecords(records, option.cap24h);
  }
}

function calculatePackage(option, durationMinutes) {
  const pricing = option.packageRule;
  if (!pricing) return null;

  const records = [];
  if (durationMinutes <= pricing.fromMinutes) {
    const charge = chargeRule(pricing.baseRule, durationMinutes);
    records.push({
      scope: "all",
      minutes: durationMinutes,
      charge,
      label: `${ruleLabel(pricing.baseRule)}，12 小時內按錶計費`,
    });
    return { amount: charge, records };
  }

  const packageCount = Math.ceil(durationMinutes / pricing.toMinutes);
  const amount = packageCount * pricing.amount;
  records.push({
    scope: "all",
    minutes: durationMinutes,
    charge: amount,
    label: `每連續 ${pricing.fromMinutes / 60}-${pricing.toMinutes / 60} 小時 MOP ${pricing.amount}`,
  });
  return { amount, records };
}

function calculateOption(option, entry, exit, entryDate) {
  const durationMinutes = Math.max(0, (exit - entry) / MINUTE);
  if (durationMinutes === 0) {
    return { amount: 0, records: [], message: "入場與離場時間相同。" };
  }

  if (option.graceMinutes && durationMinutes <= option.graceMinutes) {
    return {
      amount: 0,
      records: [
        {
          scope: "all",
          minutes: durationMinutes,
          charge: 0,
          label: `${option.graceMinutes} 分鐘內離場免費`,
        },
      ],
    };
  }

  const packageResult = calculatePackage(option, durationMinutes);
  if (packageResult) return packageResult;

  if (!option.rules.length) {
    return {
      amount: null,
      records: [],
      message: "官方收費文字未能可靠拆解。",
    };
  }

  const segments = makeSegments(entry, exit, option);
  const records = [];

  for (const segment of segments) {
    const rule =
      option.rules.find((candidate) => candidate.scope === segment.scope) ||
      option.rules.find((candidate) => candidate.scope === "all");

    if (!rule) {
      return {
        amount: null,
        records: [],
        message: `官方規則未包含${
          segment.scope === "day" ? "日間" : "夜間"
        }收費。`,
      };
    }

    records.push({
      ...segment,
      charge: chargeRule(rule, segment.minutes),
      capKey:
        segment.scope === "all"
          ? String(Math.floor((segment.start - entryDate) / (24 * 60 * MINUTE)))
          : `${dateKey(segment.start)}-${segment.scope}`,
      label: ruleLabel(rule),
    });
  }

  applyCaps(records, option);
  const amount = records.reduce((sum, record) => sum + record.charge, 0);
  return { amount: roundMoney(amount), records };
}

function getParkingAmount(park, vehicleKey) {
  if (vehicleKey === "heavy") {
    const values = HEAVY_KEYS.map((key) => park?.live?.[key]).filter(Boolean);
    if (!values.length) return null;
    const total = values.reduce((sum, value) => sum + (value.total || 0), 0);
    const available = values.reduce(
      (sum, value) => sum + (value.available || 0),
      0,
    );
    return {
      available,
      total,
      maintenance: Boolean(park?.maintenance),
    };
  }
  const value = park?.live?.[vehicleKey];
  return value
    ? {
        ...value,
        maintenance: Boolean(park?.maintenance || value.maintenance),
      }
    : null;
}

function getVehicleChoices(park) {
  const choices = [];
  for (const [key, vehicle] of Object.entries(VEHICLES)) {
    const availability = getParkingAmount(park, key);
    const tariff = parseVehicleTariff(park, key);
    if (
      (availability && availability.total !== null) ||
      tariff.supported ||
      (key === "heavy" &&
        Object.prototype.hasOwnProperty.call(park?.tariffs || {}, "heavy") &&
        park.tariffs.heavy !== "-")
    ) {
      choices.push(key);
    }
  }
  return choices.length ? choices : ["light"];
}

function calculateParkingCost({
  park,
  vehicleKey,
  entry,
  exit,
  optionId,
}) {
  const entryDate = entry instanceof Date ? entry : new Date(entry);
  const exitDate = exit instanceof Date ? exit : new Date(exit);

  if (
    Number.isNaN(entryDate.getTime()) ||
    Number.isNaN(exitDate.getTime()) ||
    exitDate <= entryDate
  ) {
    return {
      supported: false,
      amount: null,
      message: "離場時間必須晚於入場時間。",
      breakdown: [],
      source: "",
    };
  }

  const parsed = parseVehicleTariff(park, vehicleKey);
  if (!parsed.supported) {
    return {
      supported: false,
      amount: null,
      message: "此車種的官方收費資料未能自動計算，請查看官方原文。",
      breakdown: [],
      source: parsed.source,
    };
  }

  const option =
    parsed.options.find((candidate) => candidate.id === optionId) ||
    parsed.options.find((candidate) => candidate.supported);

  if (!option?.supported) {
    return {
      supported: false,
      amount: null,
      message: "此車種的官方收費資料未能自動計算，請查看官方原文。",
      breakdown: [],
      source: parsed.source,
      option,
    };
  }

  const result = calculateOption(option, entryDate, exitDate, entryDate);
  const durationMinutes = (exitDate - entryDate) / MINUTE;

  return {
    supported: result.amount !== null,
    amount: result.amount,
    message: result.message || null,
    durationMinutes,
    option,
    options: parsed.options,
    source: parsed.source,
    heading: parsed.heading,
    breakdown: result.records,
  };
}

function summarizeTariff(park, vehicleKey) {
  const parsed = parseVehicleTariff(park, vehicleKey);
  if (!parsed.supported) return "收費請查看官方原文";

  if (parsed.options.length > 1) {
    return `${parsed.options.length} 種車長收費方案`;
  }

  const option = parsed.options[0];
  const labels = option.rules.map((rule) => {
    const unit = rule.unitMinutes === 30 ? "半小時" : "小時";
    const scope =
      rule.scope === "day" ? "日" : rule.scope === "night" ? "夜" : "";
    if (rule.firstMinutes && rule.firstRate !== null) {
      return `${scope}首小時 ${rule.firstRate}，其後 ${rule.rate}/${unit}`;
    }
    return `${scope} ${rule.rate}/${unit}`;
  });
  if (option.cap24h) labels.push(`24 小時上限 ${option.cap24h}`);
  return labels.join(" · ");
}

function formatMoney(value) {
  if (value === null || value === undefined || Number.isNaN(Number(value))) {
    return "—";
  }
  const number = Number(value);
  return number % 1 === 0 ? `MOP ${number}` : `MOP ${number.toFixed(2).replace(/0$/, "")}`;
}

function formatDuration(minutes) {
  if (minutes === null || minutes === undefined) return "—";
  const total = Math.max(0, Math.round(minutes));
  const hours = Math.floor(total / 60);
  const remaining = total % 60;
  if (!hours) return `${remaining} 分鐘`;
  if (!remaining) return `${hours} 小時`;
  return `${hours} 小時 ${remaining} 分鐘`;
}
